[general]
; Daytime and nighttime color temperatures (in Kelvin)
; 6500K is neutral daylight; 3000K provides a warm reddish evening light
temp-day=6500
temp-night=3000

; Enable smooth fading transition between day and night
fade=1

; Screen brightness during day and evening/night (dimmed to 80% at night)
brightness-day=1.0
brightness-night=0.8

; Gamma adjustment
gamma=1.0

; Wayland adjustment method (wlr-gamma-control for River / wlroots)
adjustment-method=wayland
location-provider=manual

[manual]
; Paris coordinates (Europe/Paris timezone)
lat=48.8566
lon=2.3522
