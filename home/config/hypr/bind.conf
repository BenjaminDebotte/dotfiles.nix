$mainMod = SUPER

# ── Terminal & Apps ────────────────────────────────────────────────────────────
bind = $mainMod,       Return,    exec,          kitty
bind = $mainMod SHIFT, Return,    exec,          kitty  # scratchpad terminal (spterm) → fallback kitty
bind = $mainMod, Backspace, exec, wlogout --protocol layer-shell

bind = $mainMod,       grave,     exec,          code
bind = $mainMod,       w,         exec,          $BROWSER
bind = $mainMod SHIFT, w,         exec,          min
bind = $mainMod,       r,         exec,          kitty -e yazi
bind = $mainMod SHIFT, r,         exec,          kitty -e htop
bind = $mainMod,       e,         exec,          kitty -e neomutt
bind = $mainMod,       n,         exec,          kitty -e nvim -c VimwikiIndex
bind = $mainMod SHIFT, n,         exec,          kitty -e newsboat
bind = $mainMod,       m,         exec,          kitty -e ncmpcpp
bind = $mainMod,       c,         exec,          kitty -e profanity

# ── Launchers ─────────────────────────────────────────────────────────────────
bind = $mainMod,       d,         exec,          rofi -show drun
bind = $mainMod SHIFT, d,         exec,          rofi -show run
bind = $mainMod,       p,         exec,          rofi-pass --root ~/.local/share/password-store

# ── Window management ─────────────────────────────────────────────────────────
bind = $mainMod,       q,         killactive,
bind = $mainMod SHIFT, q,         exec,          wlogout --protocol layer-shell
bind = $mainMod,       Space,     layoutmsg,     swapwithmaster master
bind = $mainMod SHIFT, Space,     togglefloating,
bind = $mainMod,       f,         fullscreen,    1
bind = $mainMod SHIFT, f,         fullscreen,    0    # true fullscreen (replaces float layout)
bind = $mainMod,       s,         pin,               # togglesticky
bind = $mainMod,       v,         togglefloating,

# ── Focus (vim keys) ──────────────────────────────────────────────────────────
bind = $mainMod,       h,         movefocus,     l
bind = $mainMod,       l,         movefocus,     r
bind = $mainMod,       k,         movefocus,     u
bind = $mainMod,       j,         movefocus,     d

# ── Move windows ──────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, h,         movewindow,    l
bind = $mainMod SHIFT, l,         movewindow,    r
bind = $mainMod SHIFT, k,         movewindow,    u
bind = $mainMod SHIFT, j,         movewindow,    d

# ── Resize windows ────────────────────────────────────────────────────────────
bind = $mainMod CTRL,  h,         resizeactive,  -40 0
bind = $mainMod CTRL,  l,         resizeactive,   40 0
bind = $mainMod CTRL,  k,         resizeactive,  0 -40
bind = $mainMod CTRL,  j,         resizeactive,  0  40

# Master area resize (replaces setmfact)
bind = $mainMod,       j,         splitratio,    -0.05
bind = $mainMod,       k,         splitratio,     0.05

# ── Gaps (replaces incrgaps / togglegaps / defaultgaps) ───────────────────────
bind = $mainMod,       z,         exec,          hyprctl keyword general:gaps_in  $(($(hyprctl getoption general:gaps_in | awk 'NR==1{print $2}')+3))
bind = $mainMod,       x,         exec,          hyprctl keyword general:gaps_in  $(($(hyprctl getoption general:gaps_in | awk 'NR==1{print $2}')-3))
bind = $mainMod,       a,         exec,          hyprctl keyword general:gaps_in 0 && hyprctl keyword general:gaps_out 0
bind = $mainMod SHIFT, a,         exec,          hyprctl keyword general:gaps_in 5 && hyprctl keyword general:gaps_out 10

# ── Workspaces (replaces tags) ────────────────────────────────────────────────
bind = $mainMod,       1,         split:workspace, 1
bind = $mainMod,       2,         split:workspace, 2
bind = $mainMod,       3,         split:workspace, 3
bind = $mainMod,       4,         split:workspace, 4
bind = $mainMod,       5,         split:workspace, 5
bind = $mainMod,       6,         split:workspace, 6
bind = $mainMod,       7,         split:workspace, 7
bind = $mainMod,       8,         split:workspace, 8
bind = $mainMod,       9,         split:workspace, 9
bind = $mainMod,       0,         split:workspace, 10

bind = $mainMod SHIFT, 1,         split:movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2,         split:movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3,         split:movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4,         split:movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5,         split:movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6,         split:movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7,         split:movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8,         split:movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9,         split:movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0,         split:movetoworkspacesilent, 10

# shiftview equivalent (g / semicolon)
bind = $mainMod,       g,         split:workspace, -1
bind = $mainMod SHIFT, g,         split:movetoworkspacesilent, -1
bind = $mainMod,       semicolon, split:workspace, +1
bind = $mainMod SHIFT, semicolon, split:movetoworkspacesilent, +1

# Page Up / Down workspace cycling
bind = $mainMod,       Prior,     split:workspace, -1
bind = $mainMod SHIFT, Prior,     split:movetoworkspacesilent, -1
bind = $mainMod,       Next,      split:workspace, +1
bind = $mainMod SHIFT, Next,      split:movetoworkspacesilent, +1

# Tab → previous workspace (replaces view {0})
bind = $mainMod,       Tab,       workspace, previous

# ── Scratchpad terminal (replaces togglescratch spterm) ───────────────────────
bind = $mainMod SHIFT, Return,    togglespecialworkspace, spterm
bind = $mainMod SHIFT, Return,    exec,          hyprctl clients | grep -q 'spterm' || kitty --class spterm

# ── Screenshot ────────────────────────────────────────────────────────────────
bind = ,               Print,     exec,          hyprshot -m region --clipboard-only
bind = SHIFT,          Print,     exec,          hyprshot -m region
bind = $mainMod,       Print,     exec,          hyprshot -m output

# ── Audio (media keys + SUPER shortcuts) ──────────────────────────────────────
bindel = ,  XF86AudioRaiseVolume,  exec, pamixer --allow-boost -i 3
bindel = ,  XF86AudioLowerVolume,  exec, pamixer --allow-boost -d 3
bindl  = ,  XF86AudioMute,         exec, pamixer -t
bindl  = ,  XF86AudioMicMute,      exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

bind = $mainMod,       minus,     exec, pamixer --allow-boost -d 5
bind = $mainMod SHIFT, minus,     exec, pamixer --allow-boost -d 15
bind = $mainMod,       equal,     exec, pamixer --allow-boost -i 5
bind = $mainMod SHIFT, equal,     exec, pamixer --allow-boost -i 15
bind = $mainMod SHIFT, m,         exec, pamixer -t

# ── Media / MPD ───────────────────────────────────────────────────────────────
bindl = , XF86AudioPlay,    exec, mpc play
bindl = , XF86AudioPause,   exec, mpc pause
bindl = , XF86AudioStop,    exec, mpc stop
bindl = , XF86AudioPrev,    exec, mpc prev
bindl = , XF86AudioNext,    exec, mpc next
bindl = , XF86AudioRewind,  exec, mpc seek -10
bindl = , XF86AudioForward, exec, mpc seek +10
bindl = , XF86AudioMedia,   exec, kitty -e ncmpcpp

bind = $mainMod,       comma,     exec, mpc prev
bind = $mainMod SHIFT, comma,     exec, mpc seek 0%
bind = $mainMod,       period,    exec, mpc next
bind = $mainMod SHIFT, period,    exec, mpc repeat

# ── Brightness ────────────────────────────────────────────────────────────────
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl -n1 set 5%-

# ── Misc ──────────────────────────────────────────────────────────────────────
bind = $mainMod,       F2,        exec, hyprctl keyword input:kb_layout us  # reset keyboard
bind = $mainMod,       F4,        exec, kitty -e pulsemixer
bind = $mainMod,       F9,        exec, dmenumount
bind = $mainMod,       F10,       exec, dmenuumount
bind = $mainMod,       F11,       exec, mpv --untimed --no-cache --no-osc --no-input-default-bindings --profile=low-latency --input-conf=/dev/null --title=webcam $(ls /dev/video[0,2,4,6,8] | tail -n 1)

bind = , XF86Sleep,       exec, systemctl suspend
bind = , XF86WWW,         exec, google-chrome-stable
bind = , XF86Calculator,  exec, kitty -e bc -l
bind = , XF86TaskPane,    exec, kitty -e htop
bind = , XF86Mail,        exec, kitty -e neomutt

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
